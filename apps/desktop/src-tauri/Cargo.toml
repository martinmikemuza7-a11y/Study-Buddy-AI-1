[package]
name = "study-buddy-ai"
version = "0.1.0"
description = "Study Buddy AI desktop application"
authors = ["Study Buddy AI"]
edition = "2021"

[lib]
name = "study_buddy_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
