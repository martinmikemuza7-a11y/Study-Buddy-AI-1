openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Course-scoped API for Study Buddy AI
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: courses
    description: Authenticated course workspaces
  - name: materials
    description: Course material metadata and processing state
  - name: sessions
    description: Planned study sessions
  - name: tutor
    description: Course-aware AI tutoring
  - name: learning
    description: Active learning and progress
  - name: storage
    description: Private object storage uploads
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [courses]
      summary: Get the authenticated learner dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /courses:
    get:
      operationId: listCourses
      tags: [courses]
      summary: List the authenticated learner's courses
      responses:
        "200":
          description: Courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createCourse
      tags: [courses]
      summary: Create a course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseInput"
      responses:
        "201":
          description: Created course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /courses/{courseId}:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      operationId: getCourse
      tags: [courses]
      summary: Get one course
      responses:
        "200":
          description: Course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateCourse
      tags: [courses]
      summary: Update a course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseUpdate"
      responses:
        "200":
          description: Updated course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteCourse
      tags: [courses]
      summary: Delete a course and its scoped records
      responses:
        "204":
          description: Course deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /courses/{courseId}/materials:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      operationId: listMaterials
      tags: [materials]
      summary: List materials scoped to a course
      responses:
        "200":
          description: Course materials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Material"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createMaterial
      tags: [materials]
      summary: Register an uploaded course material
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialInput"
      responses:
        "201":
          description: Material processing record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /courses/{courseId}/materials/{materialId}:
    parameters:
      - $ref: "#/components/parameters/CourseId"
      - $ref: "#/components/parameters/MaterialId"
    delete:
      operationId: deleteMaterial
      tags: [materials]
      summary: Delete a course material
      responses:
        "204":
          description: Material deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /courses/{courseId}/sessions:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      operationId: listStudySessions
      tags: [sessions]
      summary: List study sessions scoped to a course
      responses:
        "200":
          description: Study sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudySession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createStudySession
      tags: [sessions]
      summary: Schedule a study session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudySessionInput"
      responses:
        "201":
          description: Scheduled session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /study-sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    patch:
      operationId: updateStudySession
      tags: [sessions]
      summary: Edit a study session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudySessionUpdate"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteStudySession
      tags: [sessions]
      summary: Delete a study session
      responses:
        "204":
          description: Session deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a private upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
      responses:
        "200":
          description: Presigned upload information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /courses/{courseId}/tutor:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    post:
      operationId: askTutor
      tags: [tutor]
      summary: Ask the course-aware AI tutor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TutorQuestion"
      responses:
        "200":
          description: Tutor answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorAnswer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: AI service is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /courses/{courseId}/progress:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      operationId: getCourseProgress
      tags: [learning]
      summary: Get adaptive progress for a course
      responses:
        "200":
          description: Course progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseProgress"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /courses/{courseId}/learning/next:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    post:
      operationId: getNextLearningQuestion
      tags: [learning]
      summary: Generate the next scheduled active-learning question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningQuestionRequest"
      responses:
        "200":
          description: Next question or no question due
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningQuestion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: AI service is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /courses/{courseId}/learning/answers:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    post:
      operationId: submitLearningAnswer
      tags: [learning]
      summary: Evaluate and record an active-learning answer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningAnswer"
      responses:
        "200":
          description: Evaluation feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningFeedback"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: AI service is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    MaterialId:
      name: materialId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    Course:
      type: object
      required:
        - id
        - name
        - description
        - materialCount
        - readyMaterialCount
        - progress
        - nextSession
        - activeLearning
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        materialCount:
          type: integer
        readyMaterialCount:
          type: integer
        progress:
          type: number
        nextSession:
          anyOf:
            - $ref: "#/components/schemas/StudySession"
            - type: "null"
        activeLearning:
          $ref: "#/components/schemas/ActiveLearningSettings"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CourseInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 500
    CourseUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 500
        activeLearning:
          $ref: "#/components/schemas/ActiveLearningSettings"
    ActiveLearningSettings:
      type: object
      required: [enabled, startTime, endTime, frequencyMinutes, questionCount, questionType]
      properties:
        enabled:
          type: boolean
        startTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        endTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        frequencyMinutes:
          type: integer
          minimum: 5
          maximum: 180
        questionCount:
          type: integer
          minimum: 1
          maximum: 30
        questionType:
          type: string
          enum: [multiple_choice, true_false, short_answer]
    Material:
      type: object
      required: [id, courseId, name, contentType, sizeBytes, objectPath, status, uploadedAt]
      properties:
        id:
          type: integer
        courseId:
          type: integer
        name:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
        objectPath:
          type: string
        status:
          type: string
          enum: [uploading, processing, ready, failed]
        statusMessage:
          type: ["string", "null"]
        pageCount:
          type: ["integer", "null"]
        indexedChunkCount:
          type: integer
        uploadedAt:
          type: string
          format: date-time
        processedAt:
          type: ["string", "null"]
          format: date-time
    MaterialInput:
      type: object
      required: [name, contentType, sizeBytes, objectPath]
      properties:
        name:
          type: string
          minLength: 1
        contentType:
          type: string
        sizeBytes:
          type: integer
          minimum: 1
        objectPath:
          type: string
          pattern: "^/objects/"
    StudySession:
      type: object
      required: [id, courseId, courseName, title, scheduledStart, durationMinutes, status]
      properties:
        id:
          type: integer
        courseId:
          type: integer
        courseName:
          type: string
        title:
          type: string
        scheduledStart:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        status:
          type: string
          enum: [upcoming, completed, cancelled]
    StudySessionInput:
      type: object
      required: [title, scheduledStart, durationMinutes]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 140
        scheduledStart:
          type: string
          format: date-time
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 480
    StudySessionUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 140
        scheduledStart:
          type: string
          format: date-time
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 480
        status:
          type: string
          enum: [upcoming, completed, cancelled]
    DashboardSummary:
      type: object
      required: [courseCount, materialCount, readyMaterialCount, overallProgress, upcomingSessions, recentCourse]
      properties:
        courseCount:
          type: integer
        materialCount:
          type: integer
        readyMaterialCount:
          type: integer
        overallProgress:
          type: number
        upcomingSessions:
          type: array
          items:
            $ref: "#/components/schemas/StudySession"
        recentCourse:
          anyOf:
            - $ref: "#/components/schemas/Course"
            - type: "null"
    UploadRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
          maximum: 52428800
        contentType:
          type: string
    UploadResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
    TutorQuestion:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 4000
        mode:
          type: string
          enum: [explain, summarize, beginner, examples, practice, concepts, chapter_test]
        useWeb:
          type: boolean
          default: false
    SourceReference:
      type: object
      required: [label, kind]
      properties:
        label:
          type: string
        kind:
          type: string
          enum: [uploaded_material, web]
        materialId:
          type: ["integer", "null"]
        page:
          type: ["integer", "null"]
        slide:
          type: ["integer", "null"]
        url:
          type: ["string", "null"]
          format: uri
    TutorAnswer:
      type: object
      required: [answer, sources, webUsed, historyId]
      properties:
        answer:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceReference"
        webUsed:
          type: boolean
        historyId:
          type: integer
    CourseProgress:
      type: object
      required: [courseId, progress, correctCount, incorrectCount, totalAnswered, currentDifficulty, weakTopics, recentResults]
      properties:
        courseId:
          type: integer
        progress:
          type: number
        correctCount:
          type: integer
        incorrectCount:
          type: integer
        totalAnswered:
          type: integer
        currentDifficulty:
          type: string
          enum: [beginner, developing, confident, advanced]
        weakTopics:
          type: array
          items:
            type: string
        recentResults:
          type: array
          items:
            $ref: "#/components/schemas/LearningResult"
    LearningQuestionRequest:
      type: object
      required: [scheduledSessionId]
      properties:
        scheduledSessionId:
          type: integer
    LearningQuestion:
      type: object
      required: [id, courseId, type, prompt, options, difficulty, due]
      properties:
        id:
          type: integer
        courseId:
          type: integer
        type:
          type: string
          enum: [multiple_choice, true_false, short_answer]
        prompt:
          type: string
        options:
          type: array
          items:
            type: string
        difficulty:
          type: string
          enum: [beginner, developing, confident, advanced]
        due:
          type: boolean
    LearningAnswer:
      type: object
      required: [questionId, answer, action]
      properties:
        questionId:
          type: integer
        answer:
          type: string
        action:
          type: string
          enum: [answered, skipped, dismissed, postponed]
    LearningFeedback:
      type: object
      required: [result, feedback, explanation, nextDifficulty, resultId]
      properties:
        result:
          type: string
          enum: [correct, incorrect, skipped, dismissed, postponed]
        feedback:
          type: string
        explanation:
          type: string
        nextDifficulty:
          type: string
          enum: [beginner, developing, confident, advanced]
        resultId:
          type: integer
    LearningResult:
      type: object
      required: [id, question, result, difficulty, answeredAt]
      properties:
        id:
          type: integer
        question:
          type: string
        result:
          type: string
          enum: [correct, incorrect, skipped, dismissed, postponed]
        difficulty:
          type: string
        answeredAt:
          type: string
          format: date-time